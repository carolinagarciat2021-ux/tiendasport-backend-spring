# ============================================================
# Base de datos MySQL — construida a partir de variables de entorno separadas
# (MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD), que es
# EXACTAMENTE el formato que Railway inyecta automáticamente cuando conectas
# su plugin de MySQL a este servicio (Variables > "Add Reference").
#
# Si usas Render (que no tiene MySQL administrado nativo) o cualquier otro
# proveedor de MySQL (PlanetScale, Aiven, etc.), simplemente define tú mismo
# estas 5 variables de entorno en el panel de tu servicio con los datos que
# ese proveedor te entregue — el nombre de las variables debe ser igual.
#
# En tu computador, no necesitas definir nada: usa los valores por defecto
# (después de los ":") que apuntan a tu MySQL Workbench local.
# ============================================================
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:venta_ropa_deportiva}?useSSL=true&requireSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate: "update" ajusta las tablas automáticamente si faltan columnas,
# sin borrar los datos que ya tienes. Nunca uses "create" o "create-drop" en
# una base con datos reales, porque BORRAN todo al arrancar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# JWT — la clave secreta SIEMPRE debe venir de una variable de entorno en
# producción (JWT_SECRET). El valor después de ":" es solo para tu computador
# en desarrollo local; jamás lo dejes así en la nube.
# ============================================================
jwt.secret=${JWT_SECRET:ClaveLocalDeDesarrolloCambiarEnProduccion123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:14400000}

# ============================================================
# Puerto del servidor — Railway y Render asignan el puerto ellos mismos
# a través de la variable de entorno PORT; en tu computador usa 8080.
# ============================================================
server.port=${PORT:8080}

# NOTA sobre HTTPS: en la nube (Railway/Render) NO necesitas configurar
# ningún certificado aquí. La plataforma misma recibe el tráfico HTTPS del
# público y se lo reenvía a tu aplicación por HTTP internamente — es un
# patrón llamado "TLS termination", y es la forma normal de hacerlo en la
# nube. Por eso este archivo ya no tiene configuración de server.ssl.*
